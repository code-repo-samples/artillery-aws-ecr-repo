name: Build and Push Image
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login & Push
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 983610474809.dkr.ecr.us-east-1.amazonaws.com
          docker build -t 983610474809.dkr.ecr.us-east-1.amazonaws.com/artillery-runner:latest .
          docker push 983610474809.dkr.ecr.us-east-1.amazonaws.com/artillery-runner:latest
